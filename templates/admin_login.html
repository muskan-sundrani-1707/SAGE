<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SAGE – Admin Login</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='css/sage.css') }}">
<style>
.auth-page{min-height:100vh;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(160deg,#0f1f1e 0%,#1a3330 100%);padding:24px;position:relative;overflow:hidden;}
.auth-blob{position:absolute;border-radius:50%;filter:blur(80px);opacity:.15;pointer-events:none;}
.auth-blob.b1{width:500px;height:500px;background:var(--saffron);top:-150px;right:-100px;}
.auth-blob.b2{width:380px;height:380px;background:var(--teal-l);bottom:-100px;left:-80px;}
.auth-card{background:rgba(255,255,255,.05);border:2px solid rgba(255,255,255,.1);backdrop-filter:blur(12px);
  border-radius:var(--radius-lg);box-shadow:0 24px 80px rgba(0,0,0,.5);padding:52px 48px;
  width:100%;max-width:440px;position:relative;z-index:1;}
.auth-brand{display:flex;align-items:center;gap:14px;margin-bottom:36px;}
.auth-brand-icon{width:54px;height:54px;background:linear-gradient(135deg,var(--saffron) 0%,#e06800 100%);
  border-radius:14px;display:grid;place-items:center;font-size:28px;}
.auth-brand-name{font-family:'Baloo 2',sans-serif;font-size:var(--fs-lg);font-weight:800;color:#fff;}
.auth-brand-sub{font-size:13px;color:rgba(255,255,255,.5);border-left:2px solid var(--saffron);padding-left:10px;}
.admin-badge{display:inline-flex;align-items:center;gap:8px;background:rgba(255,127,17,.2);color:var(--saffron);
  border:1px solid rgba(255,127,17,.4);border-radius:50px;padding:6px 16px;font-size:14px;font-weight:600;margin-bottom:24px;}
.auth-h2{font-family:'Baloo 2',sans-serif;font-size:var(--fs-md);font-weight:800;color:#fff;margin-bottom:6px;}
.auth-p{font-size:var(--fs-sm);color:rgba(255,255,255,.5);margin-bottom:28px;}
.auth-form{display:flex;flex-direction:column;gap:18px;}
.auth-label{font-size:var(--fs-sm);font-weight:600;color:rgba(255,255,255,.7);margin-bottom:6px;display:block;}
.auth-input{width:100%;padding:16px 18px;border:2px solid rgba(255,255,255,.12);border-radius:var(--radius);
  font-size:var(--fs);color:#fff;background:rgba(255,255,255,.07);transition:var(--transition);}
.auth-input::placeholder{color:rgba(255,255,255,.3);}
.auth-input:focus{outline:none;border-color:var(--saffron);background:rgba(255,255,255,.1);}
.auth-submit{width:100%;padding:18px;background:var(--saffron);color:#fff;border:none;border-radius:var(--radius-xl);
  font-family:'Baloo 2',sans-serif;font-size:var(--fs-md);font-weight:800;cursor:pointer;
  transition:var(--transition);margin-top:8px;}
.auth-submit:hover{background:var(--saffron-d);transform:translateY(-2px);box-shadow:0 8px 28px rgba(255,127,17,.4);}
.auth-alert{padding:14px 18px;border-radius:var(--radius);font-size:var(--fs-sm);font-weight:600;margin-bottom:16px;
  background:rgba(192,57,43,.2);color:#ff7b72;border:2px solid rgba(192,57,43,.4);}
.back-link{display:block;text-align:center;margin-top:20px;font-size:15px;color:rgba(255,255,255,.4);}
.back-link a{color:rgba(255,255,255,.6);}
.back-link a:hover{color:#fff;}
</style>
</head>
<body>
<div class="auth-page">
  <div class="auth-blob b1"></div>
  <div class="auth-blob b2"></div>
  <div class="auth-card">
    <div class="auth-brand">
      <div class="auth-brand-icon">🦉</div>
      <div>
        <div class="auth-brand-name">SAGE</div>
        <div class="auth-brand-sub">Admin Portal</div>
      </div>
    </div>
    <div class="admin-badge">🔐 Restricted Access</div>
    <h2 class="auth-h2">Admin Login</h2>
    <p class="auth-p">This area is restricted to authorised administrators only.</p>

    {% if error %}
      <div class="auth-alert">⚠️ {{ error }}</div>
    {% endif %}

    <form class="auth-form" method="POST" action="{{ url_for('admin_login') }}">
      <div>
        <label class="auth-label">Admin Username</label>
        <input class="auth-input" type="text" name="username" placeholder="admin" required autocomplete="username">
      </div>
      <div>
        <label class="auth-label">Admin Password</label>
        <input class="auth-input" type="password" name="password" placeholder="••••••••" required autocomplete="current-password">
      </div>
      <button class="auth-submit" type="submit">Access Dashboard →</button>
    </form>

    <div class="back-link">← <a href="{{ url_for('user_login') }}">Back to User Login</a></div>
  </div>
</div>
</body>
</html>
