<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SAGE – User Login</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600;700;800&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='css/sage.css') }}">
<style>
.auth-page{min-height:100vh;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(160deg,#fff8ee 0%,#e6f5f1 100%);padding:24px;position:relative;overflow:hidden;}
.auth-blob{position:absolute;border-radius:50%;filter:blur(70px);opacity:.2;pointer-events:none;}
.auth-blob.b1{width:500px;height:500px;background:var(--saffron);top:-150px;right:-100px;}
.auth-blob.b2{width:380px;height:380px;background:var(--teal);bottom:-100px;left:-80px;}
.auth-card{background:#fff;border-radius:var(--radius-lg);box-shadow:0 20px 60px rgba(26,127,110,.18);
  padding:52px 48px;width:100%;max-width:460px;position:relative;z-index:1;border:2px solid var(--border);}
.auth-brand{display:flex;align-items:center;gap:14px;margin-bottom:36px;}
.auth-brand-icon{width:54px;height:54px;background:linear-gradient(135deg,var(--saffron) 0%,var(--teal) 100%);
  border-radius:14px;display:grid;place-items:center;font-size:28px;}
.auth-brand-name{font-family:var(--font-display);font-size:var(--fs-lg);font-weight:var(--fw-blk);color:var(--teal);}
.auth-brand-sub{font-size:13px;color:var(--muted);border-left:2px solid var(--saffron);padding-left:10px;}
.auth-h2{font-family:var(--font-display);font-size:var(--fs-md);font-weight:var(--fw-bld);color:var(--text);margin-bottom:8px;}
.auth-p{font-size:var(--fs-sm);color:var(--muted);margin-bottom:28px;}
.auth-tabs{display:flex;gap:0;margin-bottom:32px;border:2px solid var(--border);border-radius:var(--radius);overflow:hidden;}
.auth-tab{flex:1;padding:14px;text-align:center;font-weight:var(--fw-bld);font-size:var(--fs-sm);
  color:var(--muted);cursor:pointer;background:var(--warm-bg);transition:var(--transition);border:none;}
.auth-tab.active{background:var(--teal);color:#fff;}
.auth-form{display:flex;flex-direction:column;gap:18px;}
.auth-label{font-size:var(--fs-sm);font-weight:var(--fw-bld);color:var(--text);margin-bottom:6px;display:block;}
.auth-input{width:100%;padding:16px 18px;border:2px solid var(--border);border-radius:var(--radius);
  font-size:var(--fs);color:var(--text);background:var(--warm-bg);transition:var(--transition);}
.auth-input:focus{outline:none;border-color:var(--teal);background:#fff;}
.auth-submit{width:100%;padding:18px;background:var(--teal);color:#fff;border:none;border-radius:var(--radius-xl);
  font-family:var(--font-display);font-size:var(--fs-md);font-weight:var(--fw-bld);cursor:pointer;
  transition:var(--transition);margin-top:8px;}
.auth-submit:hover{background:var(--teal-d);transform:translateY(-2px);}
.auth-alert{padding:14px 18px;border-radius:var(--radius);font-size:var(--fs-sm);font-weight:var(--fw-med);margin-bottom:16px;}
.auth-alert.error{background:var(--danger-bg);color:var(--danger);border:2px solid var(--danger);}
.auth-alert.success{background:var(--safe-bg);color:var(--safe);border:2px solid var(--safe);}
.auth-footer{margin-top:28px;text-align:center;font-size:15px;color:var(--muted);}
.auth-footer a{color:var(--teal);font-weight:var(--fw-bld);}
.admin-link{display:block;text-align:center;margin-top:20px;font-size:14px;color:var(--muted);}
.admin-link a{color:var(--saffron);font-weight:var(--fw-bld);}
</style>
</head>
<body>
<div class="auth-page">
  <div class="auth-blob b1"></div>
  <div class="auth-blob b2"></div>
  <div class="auth-card">
    <div class="auth-brand">
      <div class="auth-brand-icon">🦉</div>
      <div>
        <div class="auth-brand-name">SAGE</div>
        <div class="auth-brand-sub">Smart Assistance for Guided Education</div>
      </div>
    </div>

    <!-- Tabs -->
    <div class="auth-tabs">
      <button class="auth-tab {% if not show_register %}active{% endif %}" id="tabLogin">Login</button>
      <button class="auth-tab {% if show_register %}active{% endif %}"    id="tabRegister">Register</button>
    </div>

    {% if error %}
      <div class="auth-alert error">⚠️ {{ error }}</div>
    {% endif %}
    {% if success %}
      <div class="auth-alert success">✅ {{ success }}</div>
    {% endif %}

    <!-- LOGIN FORM -->
    <div id="formLogin" {% if show_register %}style="display:none"{% endif %}>
      <h2 class="auth-h2">Welcome back 👋</h2>
      <p class="auth-p">Log in to access your SAGE assistant.</p>
      <form class="auth-form" method="POST" action="{{ url_for('user_login') }}">
        <div>
          <label class="auth-label">Username</label>
          <input class="auth-input" type="text" name="username" placeholder="your_username" required autocomplete="username">
        </div>
        <div>
          <label class="auth-label">Password</label>
          <input class="auth-input" type="password" name="password" placeholder="••••••••" required autocomplete="current-password">
        </div>
        <button class="auth-submit" type="submit">Login →</button>
      </form>
    </div>

    <!-- REGISTER FORM -->
    <div id="formRegister" {% if not show_register %}style="display:none"{% endif %}>
      <h2 class="auth-h2">Create your account</h2>
      <p class="auth-p">Join SAGE and get personalised digital guidance.</p>
      <form class="auth-form" method="POST" action="{{ url_for('user_register') }}">
        <div>
          <label class="auth-label">Username <span style="color:var(--danger)">*</span></label>
          <input class="auth-input" type="text" name="username" placeholder="min 3 characters" required>
        </div>
        <div>
          <label class="auth-label">Display Name</label>
          <input class="auth-input" type="text" name="display_name" placeholder="e.g. Ramesh Ji">
        </div>
        <div>
          <label class="auth-label">Email (optional)</label>
          <input class="auth-input" type="email" name="email" placeholder="you@email.com">
        </div>
        <div>
          <label class="auth-label">Password <span style="color:var(--danger)">*</span></label>
          <input class="auth-input" type="password" name="password" placeholder="min 6 characters" required>
        </div>
        <button class="auth-submit" type="submit" style="background:var(--saffron);">Create Account →</button>
      </form>
    </div>

    <div class="admin-link">
      Admin? <a href="{{ url_for('admin_login') }}">Admin Portal →</a>
    </div>
  </div>
</div>
<script>
document.getElementById('tabLogin').addEventListener('click',()=>{
  document.getElementById('formLogin').style.display='';
  document.getElementById('formRegister').style.display='none';
  document.getElementById('tabLogin').classList.add('active');
  document.getElementById('tabRegister').classList.remove('active');
});
document.getElementById('tabRegister').addEventListener('click',()=>{
  document.getElementById('formRegister').style.display='';
  document.getElementById('formLogin').style.display='none';
  document.getElementById('tabRegister').classList.add('active');
  document.getElementById('tabLogin').classList.remove('active');
});
</script>
</body>
</html>
